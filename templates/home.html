<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Konsumsi Natural Gas</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Montserrat',sans-serif;
        }

        body{
            min-height:100vh;
            background:linear-gradient(
                135deg,
                #0f172a 0%,
                #134e4a 50%,
                #1e293b 100%
            );

            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px 20px;
        }

        .container{
            width:100%;
            max-width:1000px;
        }

        .card{
            background:rgba(255,255,255,0.12);
            backdrop-filter:blur(18px);
            -webkit-backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,.2);
            border-radius:24px;
            padding:40px;
            box-shadow:0 20px 40px rgba(0,0,0,.3);
        }

        .title{
            text-align:center;
            color:white;
            font-size:2rem;
            font-weight:800;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:rgba(255,255,255,0.85);
            margin-bottom:35px;
            line-height:1.6;
        }

        .form-group{
            display:grid;
            grid-template-columns:2fr 250px;
            gap:15px;
            align-items:center;
            margin-bottom:15px;
        }

        .form-group label{
            color:white;
            font-size:14px;
            font-weight:500;
        }

        .form-group input{
            width:100%;
            padding:12px 15px;
            border:none;
            outline:none;
            border-radius:12px;
            font-size:14px;
            background:white;
        }

        .form-group input:focus{
            box-shadow:0 0 0 4px rgba(255,255,255,.25);
        }

        .btn{
            width:100%;
            padding:16px;
            border:none;
            border-radius:14px;
            margin-top:20px;
            cursor:pointer;
            color:white;
            font-size:16px;
            font-weight:700;

            background:linear-gradient(
                135deg,
                #0891b2,
                #2563eb
            );
        }

        .btn:hover{
            transform:translateY(-2px);
        }

        .prediction{
            margin-top:25px;
            padding:20px;
            text-align:center;
            border-radius:16px;
            background:rgba(34,197,94,0.2);
            border:1px solid rgba(34,197,94,0.4);
            color:white;
            font-size:20px;
            font-weight:700;
        }

        @media(max-width:768px){
            .card{
                padding:25px;
            }
            .form-group{
                grid-template-columns:1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">

            <h1 class="title">
                Prediksi Konsumsi Natural Gas
            </h1>

            <p class="subtitle">
                Masukkan parameter proses produksi untuk memprediksi
                konsumsi Natural Gas pada Annealing Furnace.
            </p>

            <form action="{{ url_for('predict') }}" method="post">

                {% for feature in features %}
                <div class="form-group">
                    <label>{{ feature }}</label>
                    <input type="number" step="any" name="{{ feature }}" required>
                </div>
                {% endfor %}

                <!-- TOMBOL PREDIKSI -->
                <button type="submit" class="btn">
                    PREDIKSI NATURAL GAS
                </button>

            </form>

            <!-- HASIL PREDIKSI -->
            {% if prediction_text %}
                <div class="prediction">
                    {{ prediction_text }}
                </div>
            {% endif %}

        </div>
    </div>

</body>
</html>
